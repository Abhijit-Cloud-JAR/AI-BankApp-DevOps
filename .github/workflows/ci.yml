name: CI

on:
  workflow_call:

permissions:
  contents: read
  security-events: write

jobs:
  

# ==================== GATE 1 : Secret Scanning ====================

  git-leaks:
    name: Secret Scanning - GitLeaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run GitLeaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


# ==================== GATE 2 : LINT Java Checkstyle====================

  lint-java-checkstyle:
    name: Lint Java Checkstyle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: maven

      - name: Run Checkstyle
        run: mvn checkstyle:check || true


# ==================== GATE 3: SAST - Static Application Security Testing ====================

  sast:
    name: SAST - Semgrep
    runs-on: ubuntu-latest
    needs: [git-leaks, lint-java-checkstyle]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Semgrep SAST Scan
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
              p/java
              p/owasp-top-ten
              p/secrets

# ==================== GATE 4: SCA - Software Composition Analysis ====================

  sca:
    name: SCA - Dependency Scanning
    runs-on: ubuntu-latest
    needs: [git-leaks, lint-java-checkstyle]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: maven
      - name: Set up Node 14
        uses: actions/setup-node@v3
        with:
          node-version: 14
      - name: install Snyk CLI
        run: npm install -g snyk

      - name: Run Snyk SCA
        uses: snyk/actions/maven@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

    