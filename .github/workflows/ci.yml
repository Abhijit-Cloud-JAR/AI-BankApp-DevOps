name: CI

on:
  workflow_call:

permissions:
  contents: read
  security-events: write

jobs:
  

# ==================== GATE 1 : Secret Scanning ====================

  git-leaks:
    name: Secret Scanning - GitLeaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run GitLeaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


# ==================== GATE 2 : LINT Java Checkstyle====================

  lint-java-checkstyle:
    name: Lint Java Checkstyle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: maven

      - name: Run Checkstyle
        run: mvn checkstyle:check || true


# ==================== GATE 3: SAST - Static Application Security Testing ====================

sast:
    name: SAST - Semgrep
    runs-on: ubuntu-latest
    needas: [git-leaks, lint-java-checkstyle]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Semgrep SAST Scan
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/java
            p/owasp-top-ten
            p/secrets

    